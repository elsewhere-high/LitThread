[workspace]
members = ["src-tauri", "cli", "crates/litthread-core"]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-only"

# Shared dependencies declared once for both members (src-tauri / cli).
# Only version + common features live here; `optional`, target-specific
# sections, and extra features stay in the member crates
# (`{ workspace = true, features = [...] }` merges on top).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio features differ per crate (GUI: sync/rt/time/process/io-util/net;
# CLI: rt-multi-thread/macros; dev: test-util), so declare no features here.
tokio = "1"
dirs = "6"
log = "0.4"
tempfile = "3"

# Workspace release settings: strip symbols and optimize across crate boundaries.
# Binary sizes must be measured on the current platform and build.
[profile.release]
strip = true
lto = true
codegen-units = 1
